name: Build deployment image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: OCI image artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/metis-tds.oci.tar
          tags: metis-tds:${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: metis-tds-oci-${{ github.sha }}
          path: ${{ runner.temp }}/metis-tds.oci.tar
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
