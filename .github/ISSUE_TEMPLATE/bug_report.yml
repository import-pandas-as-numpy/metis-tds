name: Bug report
description: Report a reproducible defect that is not a security vulnerability.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private keys, live payloads, personal data, or unredacted production telemetry.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or revision
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Local binary
        - Container
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic, redacted inputs only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Include only the minimum relevant output. Remove IPs, passwords, tokens, and payload bytes.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I have removed secrets, credentials, personal data, live captures, and identifying telemetry.
          required: true
        - label: This report is not a security vulnerability.
          required: true
