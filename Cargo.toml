[package]
name = "metis-tds"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Contained, stateful Microsoft SQL Server TDS honeypot"
license = "Apache-2.0"
repository = "https://github.com/import-pandas-as-numpy/metis-tds"
readme = "README.md"
keywords = ["honeypot", "mssql", "security", "tds"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[lib]
name = "metis_tds"
path = "src/lib.rs"

[[bin]]
name = "metis-tds"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
regex = "1.13.1"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tiberius = "0.12.3"
tokio-util = { version = "0.7.19", features = ["compat"] }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
